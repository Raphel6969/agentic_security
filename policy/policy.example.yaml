# policy.example.yaml — declarative tool authorization policy for Sentinel Layer
# Evaluated by Policy Engine (Phase 5+). Deny-by-default for undeclared tools.

tools:
  read_email:
    allowed: true
    scope: read_only
    conditions:
      max_calls_per_session: 20

  search_web:
    allowed: true
    scope: read_only
    conditions:
      max_calls_per_session: 50

  execute_sql:
    allowed: true
    scope: restricted
    conditions:
      max_calls_per_session: 20

  write_file:
    allowed: true
    scope: restricted
    conditions:
      allowed_paths:
        - "/sandbox/**"
      max_calls_per_session: 10

  call_http:
    allowed: true
    scope: restricted
    conditions:
      allowed_domains:
        - "api.example-sandbox.com"
      max_calls_per_session: 10

  send_email:
    allowed: true
    scope: requires_approval
    conditions:
      max_calls_per_session: 3

default:
  allowed: false
  reason: "Tool not declared in policy — deny by default."
